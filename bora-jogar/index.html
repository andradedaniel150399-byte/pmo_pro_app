<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c86">
<title>Bora Jogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, celular primeiro. Cabeçalho "piso de quadra" com linhas pintadas,
   faixa de datas tipo grade de horários, cards de local, folha inferior para detalhes, nav fixa embaixo. */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --ink: #10212e;
  --muted: #586a78;
  --line: #d6e0e7;
  --court: #1d5c86;
  --court-deep: #154768;
  --paint: #f2c230;
  --on-court: #ffffff;
  --free: #1b7f53;
  --free-bg: #e2f3ea;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(16, 33, 46, .06), 0 6px 18px rgba(16, 33, 46, .07);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --gutter: 16px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b161f; --surface: #12212d; --ink: #e6edf2; --muted: #94a6b4; --line: #213545;
    --court: #4f9fd6; --court-deep: #123a56; --paint: #f2c230; --on-court: #06121b;
    --free: #52c890; --free-bg: #153527; --warn: #f0b45a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b161f; --surface: #12212d; --ink: #e6edf2; --muted: #94a6b4; --line: #213545;
  --court: #4f9fd6; --court-deep: #123a56; --paint: #f2c230; --on-court: #06121b;
  --free: #52c890; --free-bg: #153527; --warn: #f0b45a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--paint); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: var(--gutter); }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Cabeçalho: piso de quadra ---------- */
.hdr {
  position: relative; overflow: hidden;
  background: var(--court-deep); color: #fff;
  padding-block: 14px 18px;
}
.hdr::before, .hdr::after { content: ""; position: absolute; pointer-events: none; border: 2px solid rgba(255,255,255,.14); }
.hdr::before { width: 170px; height: 170px; border-radius: 50%; right: -60px; top: -40px; }
.hdr::after { left: 0; right: 0; top: 50%; border-width: 2px 0 0; }
.hdr .wrap { position: relative; z-index: 1; display: grid; gap: 14px; }
.hdr-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 30px; letter-spacing: .5px; line-height: 1; text-transform: uppercase; margin: 0; }
.logo span { color: var(--paint); }
.city-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff;
  border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; max-width: 60%;
}
.city-btn svg { flex: none; }
.city-btn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.ask { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 0; text-wrap: balance; }
.ask em { font-style: normal; color: var(--paint); }

/* ---------- Esportes ---------- */
.sports { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); scroll-snap-type: x proximity; }
.sports::-webkit-scrollbar { display: none; }
.sport {
  flex: none; scroll-snap-align: start;
  display: grid; justify-items: center; gap: 4px; width: 74px; padding: 9px 4px 8px;
  border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: #fff;
}
.sport .ico { font-size: 22px; line-height: 1; }
.sport .nm { font-size: 12px; font-weight: 600; line-height: 1.1; text-align: center; }
.sport[aria-pressed="true"] { background: var(--paint); color: #10212e; border-color: var(--paint); }

/* ---------- Datas e filtros ---------- */
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); }
.controls .wrap { display: grid; gap: 10px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day {
  display: grid; justify-items: center; gap: 1px; padding: 6px 0 7px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
}
.day .dw { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.day .dn { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1; }
.day[aria-pressed="true"] { background: var(--court); border-color: var(--court); color: var(--on-court); }
.day[aria-pressed="true"] .dw { color: inherit; opacity: .85; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.chip[aria-pressed="true"] { border-color: var(--court); color: var(--court); background: color-mix(in srgb, var(--court) 10%, var(--surface)); }
.sep { width: 1px; background: var(--line); margin-inline: 2px; }

/* ---------- Lista ---------- */
main { padding-block: 14px; }
.demo-note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.count { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0 0 10px; }
.count small { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--muted); }
.list { display: grid; gap: 12px; }
.card {
  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  display: grid; gap: 10px; padding: 14px; text-align: left; border: 0; width: 100%;
}
.card-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.card-top > div { min-width: 0; }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--court); }
.card h3 { font-family: var(--f-display); font-weight: 700; font-size: 21px; line-height: 1.1; margin: 2px 0 2px; text-wrap: balance; }
.where { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.price { text-align: right; white-space: nowrap; }
.price b { display: block; font-family: var(--f-display); font-size: 20px; font-weight: 700; line-height: 1.1; }
.price span { font-size: 12px; color: var(--muted); }
.price.free b { color: var(--free); }
.badge-free { display: inline-block; background: var(--free-bg); color: var(--free); font-weight: 700; font-size: 12px; border-radius: 6px; padding: 2px 7px; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot {
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px;
  border: 1.5px solid var(--court); color: var(--court); border-radius: 8px; padding: 4px 9px; background: transparent;
}
.slot.taken { border-color: var(--line); color: var(--muted); text-decoration: line-through; background: transparent; cursor: not-allowed; }
.slot[aria-pressed="true"] { background: var(--court); color: var(--on-court); }
.slot-more { font-size: 13px; color: var(--muted); align-self: center; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 2px 7px; }
.empty { text-align: center; padding: 34px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty .big { font-size: 36px; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 20px; }

/* ---------- Folha inferior ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 14, 20, .5); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--surface); border-radius: 20px 20px 0 0;
  max-height: 90%; overflow-y: auto; overscroll-behavior: contain;
  padding: 8px var(--gutter) calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-in { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 2px; }
.sheet-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
.sheet-head > div { min-width: 0; }
.sheet h2 { font-family: var(--f-display); font-weight: 700; font-size: 27px; line-height: 1.05; margin: 2px 0 4px; text-wrap: balance; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; }
.icon-btn[aria-pressed="true"] { color: #d23b4b; border-color: #d23b4b; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; }
.fact { padding: 9px 10px; display: grid; gap: 1px; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact .k { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.fact .v { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.sheet h4 { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .3px; text-transform: uppercase; margin: 0 0 6px; }
.sheet p { margin: 0; }
.bring { margin: 0; padding-left: 18px; color: var(--muted); }
.cta-bar { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 10px 4px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.cta-bar .sum { font-size: 13px; color: var(--muted); min-width: 0; }
.cta-bar .sum b { display: block; color: var(--ink); font-size: 16px; }
.btn {
  border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 15px;
  background: var(--court); color: var(--on-court);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--court); border: 1.5px solid var(--court); }
.btn.danger { background: transparent; color: #d23b4b; border: 1.5px solid #d23b4b; padding: 8px 12px; font-size: 13px; }
.ok-box { display: grid; gap: 10px; justify-items: center; text-align: center; padding-block: 20px 6px; }
.ok-box .ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--free-bg); color: var(--free); font-size: 30px; font-weight: 700; }
.city-list { display: grid; gap: 6px; }
.city-opt { display: flex; justify-content: space-between; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 600; }
.city-opt span { color: var(--muted); font-weight: 500; font-size: 13px; }
.city-opt[aria-pressed="true"] { border-color: var(--court); box-shadow: inset 0 0 0 1px var(--court); }

/* ---------- Reservas ---------- */
.res { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.res > div { min-width: 0; }
.res-date { width: 54px; border-radius: 10px; background: var(--court); color: var(--on-court); text-align: center; padding: 6px 0; }
.res-date .dw { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; opacity: .85; }
.res-date .dn { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; }
.res h3 { font-family: var(--f-display); font-size: 19px; margin: 0; line-height: 1.1; }
.res .meta { font-size: 13px; color: var(--muted); }
.res .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.section-title { font-family: var(--f-display); font-weight: 700; font-size: 26px; margin: 4px 0 12px; }

/* ---------- Nav inferior ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav .wrap { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
.nav button { border: 0; background: none; display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--court); }
.nav .dot { position: absolute; top: 9px; left: 50%; margin-left: 8px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--paint); color: #10212e; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding-inline: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="hdr-top">
      <h1 class="logo">Bora<span>.</span>Jogar</h1>
      <button class="city-btn" id="cityBtn" type="button" aria-label="Trocar cidade">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <b id="cityName">Porto Alegre</b>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <p class="ask" id="ask">O que tu quer <em>jogar</em> hoje?</p>
    <div class="sports" id="sports" role="group" aria-label="Esporte"></div>
  </div>
</header>

<div class="controls" id="controls">
  <div class="wrap">
    <div class="days" id="days" role="group" aria-label="Dia"></div>
    <div class="filters" id="filters" role="group" aria-label="Filtros"></div>
  </div>
</div>

<main class="wrap">
  <section id="view-explore">
    <p class="demo-note">Locais e horários de exemplo para testar o app.</p>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
  </section>
  <section id="view-bookings" hidden>
    <h2 class="section-title">Minhas reservas</h2>
    <div class="list" id="bookings"></div>
  </section>
  <section id="view-favs" hidden>
    <h2 class="section-title">Favoritos</h2>
    <div class="list" id="favs"></div>
  </section>
</main>

<nav class="nav" aria-label="Principal">
  <div class="wrap">
    <button type="button" data-view="explore" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Explorar
    </button>
    <button type="button" data-view="bookings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Reservas
      <span class="dot tnum" id="bookDot" hidden></span>
    </button>
    <button type="button" data-view="favs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      Favoritos
    </button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

const store = {
  get(k, d) { try { const v = localStorage.getItem("bj:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("bj:" + k, JSON.stringify(v)); } catch {} },
};
const today = new Date(); today.setHours(0,0,0,0);
const DAYS = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; });
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

const S = {
  city: store.get("city", "poa"),
  sport: store.get("sport", "beach"),
  day: 0,
  price: "all",     // all | free | paid
  period: "all",    // all | manha | tarde | noite
  view: "explore",
  favs: store.get("favs", []),
  bookings: store.get("bookings", []),
};

/* ================= Utilidades ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const brl = (v) => "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 0 });
const dkey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const sportOf = (id) => SPORTS.find((s) => s.id === id);
const cityOf = (id) => CITIES.find((c) => c.id === id);
const venueOf = (id) => VENUES.find((v) => v.id === id);
const fmtDay = (d) => `${WD[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}`;

function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function priceLabel(p) {
  switch (p.t) {
    case "free": return { big: "Grátis", small: "", free: true };
    case "hour": return { big: brl(p.v), small: "por hora" };
    case "person": return { big: brl(p.v), small: "por pessoa" };
    case "class": return { big: brl(p.v), small: "por aula" };
    case "month": return { big: brl(p.v), small: p.trial ? "/mês · 1ª aula grátis" : "por mês" };
  }
}
const isFree = (p) => p.t === "free";
const firstIsFree = (p) => p.t === "free" || (p.t === "month" && p.trial);

function inPeriod(t) {
  const h = parseInt(t, 10);
  if (S.period === "manha") return h < 12;
  if (S.period === "tarde") return h >= 12 && h < 18;
  if (S.period === "noite") return h >= 18;
  return true;
}

// Slots do dia com disponibilidade simulada (determinística por local+data+hora)
function slotsFor(v, d) {
  if (!v.days.includes(d.getDay())) return [];
  const now = new Date();
  return v.times.map((t) => {
    const [hh, mm] = t.split(":").map(Number);
    const at = new Date(d); at.setHours(hh, mm, 0, 0);
    const past = at < now;
    const booked = S.bookings.some((b) => b.venue === v.id && b.date === dkey(d) && b.time === t);
    const busy = v.kind === "rent" && hash(v.id + dkey(d) + t) % 3 === 0;
    return { t, taken: past || busy, mine: booked };
  });
}

function renderFilters() {

  const T = [["all","Qualquer hora"],["manha","Manhã"],["tarde","Tarde"],["noite","Noite"]];

    T.map(([k,l]) => `<button type="button" class="chip" data-period="${k}" aria-pressed="${S.period === k}">${l}</button>`).join("");
}

/* ================= Render: lista ================= */
function cardHTML(v, d, opts = {}) {
  const pl = priceLabel(v.price);
  const slots = d ? slotsFor(v, d).filter((s) => inPeriod(s.t)) : [];
  const show = slots.slice(0, 6);
  const more = slots.length - show.length;
  return `<button type="button" class="card" data-open="${v.id}">
    <div class="card-top">
      <div>
        <div class="kind">${KIND[v.kind]}</div>
        <h3>${esc(v.nm)}</h3>
        <div class="where">${esc(v.bairro)}${opts.city ? " · " + esc(cityOf(v.city).nm) : ""}</div>
      </div>
      <div class="price ${pl.free ? "free" : ""}"><b class="tnum">${pl.big}</b>${pl.small ? `<span>${pl.small}</span>` : ""}</div>
    </div>
    ${d ? `<div class="slots">${show.map((s) => `<span class="slot ${s.taken && !s.mine ? "taken" : ""}" ${s.mine ? 'aria-pressed="true"' : ""}>${s.t}</span>`).join("")}${more > 0 ? `<span class="slot-more">+${more}</span>` : ""}</div>` : ""}
    <div class="tags">${firstIsFree(v.price) && !isFree(v.price) ? `<span class="badge-free">1ª aula grátis</span>` : ""}${v.sports.map((id) => `<span class="tag">${sportOf(id).nm}</span>`).join("")}<span class="tag">${esc(v.cap)}</span></div>
  </button>`;
}

function renderList() {
  const d = DAYS[S.day];
  const rows = VENUES
    .filter((v) => v.city === S.city && v.sports.includes(S.sport))
    .filter((v) => S.price === "all" || (S.price === "free" ? firstIsFree(v.price) : !isFree(v.price)))
    .map((v) => ({ v, slots: slotsFor(v, d).filter((s) => inPeriod(s.t)) }))
    .filter((r) => r.slots.length)
    .sort((a, b) => (a.slots.find((s) => !s.taken)?.t || "99").localeCompare(b.slots.find((s) => !s.taken)?.t || "99"));

  const sp = sportOf(S.sport).nm;
  $("#count").innerHTML = rows.length
    ? `${rows.length} ${rows.length === 1 ? "opção" : "opções"} de ${esc(sp.toLowerCase())} <small>· ${S.day === 0 ? "hoje" : fmtDay(d)}</small>`
    : "";
  if (!rows.length) {
    const other = VENUES.filter((v) => v.city === S.city && v.sports.includes(S.sport)).length;
    $("#list").innerHTML = `<div class="empty"><span class="big" aria-hidden="true">${sportOf(S.sport).ico}</span>
      <b>Nenhum horário de ${esc(sp.toLowerCase())} nesse filtro</b>
      <span>${other ? "Tenta outro dia ou outro período." : `Ainda não temos locais de ${esc(sp.toLowerCase())} em ${esc(cityOf(S.city).nm)}. Tenta outra cidade ou esporte.`}</span></div>`;
    return;
  }
  $("#list").innerHTML = rows.map((r) => cardHTML(r.v, d)).join("");
}

function renderBookings() {
  const list = S.bookings.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $("#bookDot").hidden = !list.length;
  $("#bookDot").textContent = list.length;
  if (!list.length) {
    $("#bookings").innerHTML = `<div class="empty"><span class="big" aria-hidden="true">📅</span><b>Nenhuma reserva ainda</b><span>Escolhe um esporte, toca num local e reserva um horário.</span></div>`;
    return;
  }
  $("#bookings").innerHTML = list.map((b) => {
    const v = venueOf(b.venue); const d = new Date(b.date + "T00:00:00");
    return `<div class="res">
      <div class="res-date"><div class="dw">${WD[d.getDay()]}</div><div class="dn tnum">${d.getDate()}</div></div>
      <div>
        <h3>${esc(v.nm)}</h3>
        <div class="meta tnum">${b.time} · ${esc(sportOf(b.sport).nm)} · ${esc(v.bairro)}</div>
        <div class="meta tnum">${b.total ? "Total " + brl(b.total) + " · pagar no local" : "Sem custo"}</div>
        <div class="actions" data-res="${b.id}">
          <button type="button" class="btn ghost" data-open="${v.id}" style="padding:8px 12px;font-size:13px">Ver local</button>
          <button type="button" class="btn danger" data-cancel="${b.id}">Cancelar</button>
        </div>
      </div></div>`;
  }).join("");
}

function renderFavs() {
  const list = S.favs.map(venueOf).filter(Boolean);
  $("#favs").innerHTML = list.length

function renderAll() { renderSports(); renderDays(); renderFilters(); renderList(); renderBookings(); renderFavs(); }

/* ================= Folha de detalhes ================= */
let sheetState = null;
function openSheet(html) { $("#sheetIn").innerHTML = `<div class="grab"></div>` + html; $("#sheet").hidden = false; $("#scrim").hidden = false; $("#sheet").scrollTop = 0; document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheet").hidden = true; $("#scrim").hidden = true; document.body.style.overflow = ""; sheetState = null; }

function openVenue(id) {
  const v = venueOf(id);
  const sport = v.sports.includes(S.sport) ? S.sport : v.sports[0];
  sheetState = { venue: id, day: S.day, time: null, sport, people: v.price.t === "person" ? 1 : 1 };
  drawVenue();
}

function totalFor(v, st) {
  const p = v.price;
  if (p.t === "hour") return p.v;
  if (p.t === "person") return p.v * st.people;
  if (p.t === "class") return p.v;
  return 0;
}

function drawVenue() {
  const st = sheetState; const v = venueOf(st.venue); const d = DAYS[st.day];
  const pl = priceLabel(v.price);
  const slots = slotsFor(v, d);
  const fav = S.favs.includes(v.id);
  const total = totalFor(v, st);
  const verb = v.kind === "rent" ? "Reservar" : v.kind === "class" ? "Agendar aula" : "Confirmar presença";
  const priceExplain = {
    free: "Não tem custo. Só aparecer no horário.",
    hour: `${brl(v.price.v)} por hora de quadra, dividido entre quem joga. Pagamento no local.`,
    person: `${brl(v.price.v)} por pessoa, pago na hora.`,
    class: `${brl(v.price.v)} por aula avulsa.`,
    month: `Plano de ${brl(v.price.v)} por mês.${v.price.trial ? " A primeira aula é grátis." : ""}`,
  }[v.price.t];

  openSheet(`
    <div class="sheet-head">
      <div>
        <div class="kind">${KIND[v.kind]}</div>
        <h2>${esc(v.nm)}</h2>
        <div class="where">${esc(v.bairro)} · ${esc(cityOf(v.city).nm)}</div>
      </div>
      <button type="button" class="icon-btn" data-fav="${v.id}" aria-pressed="${fav}" aria-label="${fav ? "Remover dos favoritos" : "Salvar nos favoritos"}">${fav ? "♥" : "♡"}</button>
    </div>
    <div class="facts">
      <div class="fact"><span class="k">Custo</span><span class="v tnum">${pl.big}${pl.small ? ` <span style="font-weight:500;color:var(--muted);font-size:12px">${pl.small.replace(" · 1ª aula grátis","")}</span>` : ""}</span></div>
      <div class="fact"><span class="k">Formato</span><span class="v">${esc(v.cap)}</span></div>
      <div class="fact"><span class="k">Esportes</span><span class="v">${v.sports.map((s) => sportOf(s).nm).join(", ")}</span></div>
    </div>
    <p>${esc(v.about)}</p>
    <div>
      <h4>Horários</h4>
      <div class="days" style="margin-bottom:10px">${DAYS.map((dd, i) => `<button type="button" class="day" data-sday="${i}" aria-pressed="${i === st.day}" aria-label="${fmtDay(dd)}"><span class="dw">${i === 0 ? "Hoje" : WD[dd.getDay()]}</span><span class="dn tnum">${dd.getDate()}</span></button>`).join("")}</div>
      ${slots.length
        ? `<div class="slots">${slots.map((s) => `<button type="button" class="slot ${s.taken || s.mine ? "taken" : ""}" data-time="${s.t}" ${s.taken || s.mine ? "disabled" : ""} aria-pressed="${st.time === s.t}">${s.t}${s.mine ? " ✓" : ""}</button>`).join("")}</div>
           <p class="demo-note" style="margin:8px 0 0">${v.kind === "rent" ? "Horários riscados já estão reservados." : "Horários riscados já passaram."}</p>`
        : `<p class="demo-note" style="margin:0">Sem horários em ${fmtDay(d)}. Funciona ${v.days.length === 7 ? "todos os dias" : v.days.map((x) => WD[x]).join(", ")}.</p>`}
    </div>
    ${v.price.t === "person" ? `<div><h4>Quantas pessoas?</h4><div class="filters">${[1,2,3,4].map((n) => `<button type="button" class="chip" data-people="${n}" aria-pressed="${st.people === n}">${n}</button>`).join("")}</div></div>` : ""}
    <div><h4>Quanto custa</h4><p>${priceExplain}</p></div>
    <div><h4>O que levar</h4><ul class="bring">${v.bring.map((b) => `<li>${esc(b)}</li>`).join("")}</ul></div>
    <div class="cta-bar">
      <div class="sum">${st.time ? `<b class="tnum">${fmtDay(d)} · ${st.time}</b>${total ? brl(total) + " · pagar no local" : "Sem custo"}` : "Escolhe um horário"}</div>
      <button type="button" class="btn" id="confirmBtn" ${st.time ? "" : "disabled"}>${verb}</button>
    </div>`);
}

function confirmBooking() {
  const st = sheetState; const v = venueOf(st.venue); const d = DAYS[st.day];
  const b = { id: "b" + Date.now(), venue: v.id, sport: st.sport, date: dkey(d), time: st.time, total: totalFor(v, st), people: st.people };
  S.bookings.push(b); store.set("bookings", S.bookings);
  openSheet(`<div class="ok-box">
      <div class="ring">✓</div>
      <h2 style="margin:0">${v.kind === "rent" ? "Quadra reservada" : v.kind === "class" ? "Aula agendada" : "Presença confirmada"}</h2>
      <p class="tnum">${esc(v.nm)}<br>${fmtDay(d)} às ${st.time}</p>
      <p class="demo-note" style="margin:0">${b.total ? "Total de " + brl(b.total) + ", pago no local." : "Sem custo."} Nesta versão de teste a reserva fica salva só neste aparelho.</p>
      <div class="filters" style="justify-content:center">
        <button type="button" class="btn ghost" data-close>Continuar explorando</button>
        <button type="button" class="btn" data-goto="bookings">Ver reservas</button>
      </div></div>`);
  renderList(); renderBookings();
}

function openCity() {
  openSheet(`<h2>De onde tu é?</h2>
    <div class="city-list">${CITIES.map((c) => {
      const n = VENUES.filter((v) => v.city === c.id).length;
      return `<button type="button" class="city-opt" data-city="${c.id}" aria-pressed="${c.id === S.city}">${c.nm}, ${c.uf}<span class="tnum">${n} locais</span></button>`;
    }).join("")}</div>`);
}

/* ================= Navegação ================= */
function go(view) {
  S.view = view;
  for (const k of ["explore","bookings","favs"]) $("#view-" + k).hidden = k !== view;
  $("#controls").hidden = view !== "explore";
  document.querySelectorAll(".nav [data-view]").forEach((b) => {
    if (b.dataset.view === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }

/* ================= Eventos ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, .scrim"); if (!el) return;
  const ds = el.dataset;
  if (el.id === "scrim" || ds.close !== undefined) return closeSheet();
  if (el.id === "cityBtn") return openCity();
  if (ds.city) { S.city = ds.city; store.set("city", S.city); closeSheet(); renderSports(); renderList(); return; }
  if (ds.sport) { S.sport = ds.sport; store.set("sport", S.sport); renderSports(); renderList(); return; }
  if (ds.day) { S.day = +ds.day; renderDays(); renderList(); return; }
  if (ds.price) { S.price = ds.price; renderFilters(); renderList(); return; }
  if (ds.period) { S.period = ds.period; renderFilters(); renderList(); return; }
  if (ds.view) { closeSheet(); return go(ds.view); }
  if (ds.goto) { closeSheet(); return go(ds.goto); }
  if (ds.open) return openVenue(ds.open);
  if (ds.sday) { sheetState.day = +ds.sday; sheetState.time = null; return drawVenue(); }
  if (ds.time) { sheetState.time = sheetState.time === ds.time ? null : ds.time; return drawVenue(); }
  if (ds.people) { sheetState.people = +ds.people; return drawVenue(); }
  if (el.id === "confirmBtn") return confirmBooking();
  if (ds.fav) {
    const on = !S.favs.includes(ds.fav);
    S.favs = on ? [...S.favs, ds.fav] : S.favs.filter((x) => x !== ds.fav);
    store.set("favs", S.favs); renderFavs(); drawVenue();
    return toast(on ? "Salvo nos favoritos" : "Removido dos favoritos");
  }
  if (ds.cancel) {
    const box = el.closest("[data-res]");
    box.innerHTML = `<span class="meta">Cancelar esta reserva?</span>
      <button type="button" class="btn danger" data-cancelok="${ds.cancel}">Sim, cancelar</button>
      <button type="button" class="btn ghost" data-keep style="padding:8px 12px;font-size:13px">Manter</button>`;
    return;
  }
  if (ds.cancelok) { S.bookings = S.bookings.filter((b) => b.id !== ds.cancelok); store.set("bookings", S.bookings); renderBookings(); renderList(); return toast("Reserva cancelada"); }
  if (ds.keep !== undefined) return renderBookings();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

renderAll();
})();
</script>
</body>
</html>
